info:
  description: REST API for Uptaris infrastructure monitoring.
  title: Uptaris API
  version: 0.1.0
openapi: 3.1.0
paths:
  /admin/users:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Results per page
        in: query
        name: pageSize
        schema:
          default: 20
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.UserListResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.BadRequestError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.UnauthorizedError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ForbiddenError'
          description: Forbidden
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ErrorResponse'
          description: Service temporarily unavailable
      security:
      - bearerauth: []
      summary: List users
      tags:
      - admin
  /admin/users/{userId}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.BadRequestError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.UnauthorizedError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ForbiddenError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.NotFoundError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ConflictError'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ErrorResponse'
          description: Service temporarily unavailable
      security:
      - bearerauth: []
      summary: Delete user and revoke sessions
      tags:
      - admin
    patch:
      description: Changes user authorization role and revokes every active refresh
        session. Existing access tokens are rejected because their role claim no longer
        matches stored role.
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          minimum: 1
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_request.UserRoleInput'
        description: New user role
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.UserRecord'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.BadRequestError'
          description: Malformed user ID or JSON
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.UnauthorizedError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ForbiddenError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.NotFoundError'
          description: User not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ConflictError'
          description: Administrator cannot change own role
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ErrorResponse'
          description: Body exceeds 64 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ErrorResponse'
          description: JSON content type required
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ValidationError'
          description: Role must be viewer, operator, or admin
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_response.ErrorResponse'
          description: Service temporarily unavailable
      security:
      - bearerauth: []
      summary: Update user role
      tags:
      - admin
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_uptaris_uptaris_backend_internal_request.Credentials'
        description: Email and password
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
