name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/routeTree.gen.ts
      - run: bun run check
        working-directory: frontend
      - run: bun run lint
        working-directory: frontend
      - run: bun audit
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: "$(go env GOPATH)/bin/staticcheck ./..."
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go build ./cmd/api
